name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autohire
          POSTGRES_PASSWORD: autohire
          POSTGRES_DB: autohire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://autohire:autohire@localhost:5432/autohire_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-placeholder
      TOKEN_ENCRYPTION_KEY: ${{ steps.fernet.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt
      - id: fernet
        run: echo "key=$(python -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')" >> "$GITHUB_OUTPUT"
      - run: ruff check backend
      - run: mypy backend/app
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest --cov=app/services --cov-report=term-missing --cov-fail-under=70
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # NOTE: the `contract` and `e2e` jobs below are commented out until TS-00
  # (bootstrap) lands the scripts and the e2e/ folder they depend on. Uncomment
  # them as part of TS-00's final "Wire-up" step, not before — see TS-00's
  # checklist item for this.
