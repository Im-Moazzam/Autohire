[tools]
python = "3.12"
node = "20"

[env]
_.python.venv = { path = ".venv", create = true }
TEST_DATABASE_URL = "postgresql+psycopg://autohire:autohire@db:5432/autohire_test"

[tasks.setup]
description = "One-time: toolchain + hooks + deps"
run = ["mise install", "pip install pre-commit && pre-commit install", "cd frontend && npm install"]

[tasks.up]
description = "Build and start the docker stack"
run = "docker compose up -d --build"

[tasks.down]
description = "Stop the docker stack"
run = "docker compose down"

[tasks."restart:api"]
description = "Restart the api container (e.g. after editing .env)"
run = "docker compose restart api"

[tasks.logs]
description = "Tail api + worker logs"
run = "docker compose logs -f api worker"

[tasks."db:migrate"]
description = "Apply Alembic migrations"
run = "docker compose exec api alembic upgrade head"

[tasks."db:revision"]
description = "Create an Alembic revision. Usage: mise run db:revision -- \"add apply_slug\""
run = "docker compose exec api alembic revision --autogenerate -m \"{{arg(name='m')}}\""

[tasks."db:seed"]
description = "Seed one fake recruiter (no demo data)"
run = "docker compose exec api python -m app.scripts.seed"

[tasks."db:seed-demo"]
description = "Rebuild a full demo world: recruiter, templates, jobs, candidates, rankings, interviews, emails. Drop real resumes in backend/seed_resumes/ first (see its README)."
run = "docker compose exec api python -m app.scripts.seed_demo"

[tasks."db:test-create"]
description = "One-time (and safe to re-run): create + migrate the autohire_test database, so tests never run against dev data"
run = [
  "docker compose exec -T db psql -U autohire -d postgres -c \"SELECT 1 FROM pg_database WHERE datname='autohire_test'\" | grep -q 1 || docker compose exec -T db createdb -U autohire autohire_test",
  "docker compose exec -e DATABASE_URL={{env.TEST_DATABASE_URL}} api alembic upgrade head",
]

[tasks.test]
description = "Run backend + frontend test suites (backend runs against autohire_test, never the dev database)"
depends = ["db:test-create"]
run = ["docker compose exec -e DATABASE_URL={{env.TEST_DATABASE_URL}} api pytest -q --cov=app/services --cov-fail-under=70", "cd frontend && npm run test -- --run"]

[tasks.e2e]
description = "Run Playwright e2e tests"
run = "cd e2e && npx playwright test"

[tasks.lint]
description = "Run pre-commit on all files"
run = "pre-commit run --all-files"

[tasks."api-client"]
description = "Regenerate the typed frontend client from the live API"
run = ["docker compose exec -T api python -m app.scripts.dump_openapi > docs/openapi.json", "npx openapi-typescript docs/openapi.json -o frontend/src/lib/api.d.ts"]

[tasks."docs:api"]
description = "Regenerate OpenAPI spec"
run = ["mkdir -p docs/generated", "docker compose exec -T api python -m app.scripts.dump_openapi > docs/generated/openapi.json"]

[tasks."docs:erd"]
description = "Regenerate ERD from the live database"
run = ["mkdir -p docs/generated", "docker compose exec -T api python -m app.scripts.dump_erd > docs/generated/erd.puml"]

[tasks."docs:uml"]
description = "Regenerate class diagram from models and services"
run = ["mkdir -p docs/generated", "docker compose exec -T api pyreverse -o puml -p AutoHire app/models app/services -d /app/../docs/generated"]

[tasks."docs:tests"]
description = "Regenerate test + coverage report (runs against autohire_test, never the dev database)"
depends = ["db:test-create"]
run = ["mkdir -p docs/generated", "docker compose exec -e DATABASE_URL={{env.TEST_DATABASE_URL}} api pytest --html=/app/../docs/generated/test-report.html --self-contained-html --cov=app --cov-report=html:/app/../docs/generated/coverage"]

[tasks.docs]
description = "Regenerate all report artifacts"
depends = ["docs:api", "docs:erd", "docs:uml", "docs:tests"]

[tasks.reset]
description = "DESTRUCTIVE: wipes the database. Wipe volumes, rebuild, migrate, seed. Run 'mise run db:seed-demo' after to rebuild demo data."
run = ["docker compose down -v", "docker compose up -d --build", "sleep 8", "mise run db:migrate", "mise run db:seed"]
