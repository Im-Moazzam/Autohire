services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autohire
      POSTGRES_PASSWORD: autohire
      POSTGRES_DB: autohire
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohire"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Local mail catcher. Every email the app "sends" in local mode lands here.
  # Open http://localhost:8025 to read them. No Gmail, no quota, no OAuth.
  mailhog:
    image: mailhog/mailhog
    ports: ["1025:1025", "8025:8025"]

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    # docs-uml and docs-tests (Makefile) write to /app/../docs/generated, i.e.
    # /docs/generated inside this container — mount ./docs so it lands on the host.
    volumes: ["./backend:/app", "./storage:/storage", "./docs:/docs", "model_cache:/models"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Runs on Linux inside the container, so Celery's prefork pool works correctly
  # even when you are developing on Windows.
  worker:
    build: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file: .env
    volumes: ["./backend:/app", "./storage:/storage", "model_cache:/models"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    env_file: .env
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]

volumes:
  pgdata:
  # US-18: the ~90MB all-MiniLM-L6-v2 ONNX model downloads on first embed()
  # call. Named volume so a container restart doesn't pay for it again.
  model_cache:
